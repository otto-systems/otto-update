name: cross-platform-installer-generation

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - installer-built
      - installer-ready
  pull_request:
    paths:
      - "manifests/**"
      - "ottoupdate/**"
      - ".github/workflows/macos-installer-validation.yml"
  push:
    paths:
      - "manifests/**"
      - "ottoupdate/**"
      - ".github/workflows/macos-installer-validation.yml"

jobs:
  prepare-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import json
          with open('manifests/latest.json', 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          print(data['targetVersion'])
          PY
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-installers:
    needs: prepare-metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            binaryPath: ottoupdate/target/x86_64-pc-windows-msvc/release/ottoupdate-server.exe
            installerScript: ottoupdate/deploy/windows/install.ps1
            artifactExt: zip
          - runner: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            binaryPath: ottoupdate/target/x86_64-unknown-linux-gnu/release/ottoupdate-server
            installerScript: ottoupdate/deploy/linux/install.sh
            artifactExt: tar.gz
          - runner: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            binaryPath: ottoupdate/target/aarch64-apple-darwin/release/ottoupdate-server
            installerScript: ottoupdate/deploy/macos/install.sh
            plistPath: ottoupdate/deploy/macos/com.otto.ottoupdate.plist
            artifactExt: tar.gz

    concurrency:
      group: installer-build-${{ github.ref_name }}-${{ matrix.platform }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ottoupdate

      - name: Build ottoupdate-server
        working-directory: ottoupdate
        run: cargo build --release -p ottoupdate-server --target ${{ matrix.target }}

      - name: Prepare artifact names
        shell: bash
        run: |
          VERSION="${{ needs.prepare-metadata.outputs.version }}"
          ARTIFACT_NAME="otto-system-${VERSION}-${{ matrix.platform }}.${{ matrix.artifactExt }}"
          echo "OTTO_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "OTTO_ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      - name: Package Windows installer artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "otto-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "${{ matrix.binaryPath }}" -Destination (Join-Path $stage "ottoupdate-server.exe") -Force
          Copy-Item -Path "${{ matrix.installerScript }}" -Destination (Join-Path $stage "install.ps1") -Force
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $env:OTTO_ARTIFACT_NAME -CompressionLevel Optimal

      - name: Package Linux installer artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/otto-stage"
          mkdir -p "${STAGE}"
          cp "${{ matrix.binaryPath }}" "${STAGE}/ottoupdate-server"
          cp "${{ matrix.installerScript }}" "${STAGE}/install.sh"
          chmod +x "${STAGE}/ottoupdate-server" "${STAGE}/install.sh"
          tar -czf "${OTTO_ARTIFACT_NAME}" -C "${STAGE}" .

      - name: Package macOS installer artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/otto-stage"
          mkdir -p "${STAGE}"
          cp "${{ matrix.binaryPath }}" "${STAGE}/ottoupdate-server"
          cp "${{ matrix.installerScript }}" "${STAGE}/install.sh"
          cp "${{ matrix.plistPath }}" "${STAGE}/com.otto.ottoupdate.plist"
          chmod +x "${STAGE}/ottoupdate-server" "${STAGE}/install.sh"
          tar -czf "${OTTO_ARTIFACT_NAME}" -C "${STAGE}" .

      - name: Log build metadata
        shell: bash
        run: |
          set -euo pipefail
          SHA256=$(python - <<'PY'
          import hashlib
          import os
          path = os.environ['OTTO_ARTIFACT_NAME']
          h = hashlib.sha256()
          with open(path, 'rb') as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b''):
                  h.update(chunk)
          print(h.hexdigest())
          PY
          )
          SIZE=$(python - <<'PY'
          import os
          print(os.path.getsize(os.environ['OTTO_ARTIFACT_NAME']))
          PY
          )
          cat > "build-metadata-${{ matrix.platform }}.json" <<EOF
          {
            "platform": "${{ matrix.platform }}",
            "runner": "${{ matrix.runner }}",
            "target": "${{ matrix.target }}",
            "version": "${OTTO_VERSION}",
            "artifact": "${OTTO_ARTIFACT_NAME}",
            "sha256": "${SHA256}",
            "sizeBytes": ${SIZE},
            "commit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: otto-system-${{ needs.prepare-metadata.outputs.version }}-${{ matrix.platform }}.${{ matrix.artifactExt }}

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-metadata
          path: build-metadata-${{ matrix.platform }}.json

  verify-linux-installer:
    needs:
      - prepare-metadata
      - build-installers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux installer artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-installer
          path: ${{ runner.temp }}/linux-artifact

      - name: Verify Linux installer package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare-metadata.outputs.version }}"
          FILE="${RUNNER_TEMP}/linux-artifact/otto-system-${VERSION}-linux-x64.tar.gz"
          WORK="${RUNNER_TEMP}/linux-verify"
          mkdir -p "${WORK}"
          tar -xzf "${FILE}" -C "${WORK}"
          test -f "${WORK}/install.sh"
          test -f "${WORK}/ottoupdate-server"
          chmod +x "${WORK}/ottoupdate-server"
          cat > "${WORK}/config.toml" <<EOF
          [server]
          bind = "127.0.0.1:17431"
          EOF
          "${WORK}/ottoupdate-server" --config "${WORK}/config.toml" >/tmp/ottoupdate-linux.log 2>&1 &
          PID=$!
          trap 'kill ${PID} >/dev/null 2>&1 || true' EXIT
          BASE_URL=""
          HEALTH_STATUS="unhealthy"
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:17431/health" >/dev/null; then
              BASE_URL="http://127.0.0.1:17431"
              HEALTH_STATUS="ok"
              break
            fi
            if curl -fsS "http://127.0.0.1:7430/health" >/dev/null; then
              BASE_URL="http://127.0.0.1:7430"
              HEALTH_STATUS="ok"
              break
            fi
            sleep 1
          done

          if ! kill -0 "${PID}" >/dev/null 2>&1; then
            echo "ottoupdate-server process exited before health check" >&2
            exit 1
          fi

          if [ -z "${BASE_URL}" ]; then
            echo "No healthy endpoint found on 17431 or 7430" >&2
            exit 1
          fi

          cat > /tmp/otto-linux-verify-trace.json <<EOF
          {
            "platform": "linux-x64",
            "version": "${VERSION}",
            "baseUrl": "${BASE_URL}",
            "healthStatus": "${HEALTH_STATUS}",
            "pid": "${PID}",
            "runId": "${GITHUB_RUN_ID}",
            "sha": "${GITHUB_SHA}",
            "result": "pass"
          }
          EOF

      - name: Validate Otto ecosystem contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f "src/generated_cli/index.ts"
          test -f "src/generated_api/index.ts"
          test -f "ottoupdate/ottoupdate-core/src/manifest_fetcher.rs"
          test -f "ottoupdate/ottoupdate-core/src/downloader.rs"
          test -f "ottoupdate/ottoupdate-core/src/applier.rs"

      - name: Upload Linux verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-verification-logs
          path: |
            /tmp/ottoupdate-linux.log
            /tmp/otto-linux-verify-trace.json

  verify-macos-installer:
    needs:
      - prepare-metadata
      - build-installers
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-installer
          path: ${{ runner.temp }}/macos-artifact

      - name: Verify macOS installer package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare-metadata.outputs.version }}"
          FILE="${RUNNER_TEMP}/macos-artifact/otto-system-${VERSION}-macos-arm64.tar.gz"
          WORK="${RUNNER_TEMP}/macos-verify"
          mkdir -p "${WORK}"
          tar -xzf "${FILE}" -C "${WORK}"
          test -f "${WORK}/install.sh"
          test -f "${WORK}/ottoupdate-server"
          chmod +x "${WORK}/ottoupdate-server" "${WORK}/install.sh"
          echo "macOS installer artifact verified"

      - name: Upload macOS verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verification-logs
          path: |
            ${{ runner.temp }}/macos-verify

  notify-orchestrator:
    needs:
      - prepare-metadata
      - build-installers
      - verify-linux-installer
      - verify-macos-installer
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify OttoSuite-Orchestrator via repository_dispatch
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.OTTO_ORCHESTRATOR_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "No OTTO_ORCHESTRATOR_DISPATCH_TOKEN configured; notification step skipped."
            exit 0
          fi

          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/otto-systems/OttoSuite/dispatches \
            -d @- <<EOF
          {
            "event_type": "installer-build-complete",
            "client_payload": {
              "workflow": "cross-platform-installer-generation",
              "version": "${{ needs.prepare-metadata.outputs.version }}",
              "runId": "${{ github.run_id }}",
              "runNumber": "${{ github.run_number }}",
              "status": "${{ job.status }}",
              "sha": "${{ github.sha }}"
            }
          }
          EOF
